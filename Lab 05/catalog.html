<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Product Catalog</title>
</head>
<body>

    <div class="container" id="catalog" style="max-width: 500px; margin: auto;">
        <h2 style="text-align:center;">Update Product Catalog</h2>
        <form>
            <table align="center" cellpadding="10">
                <tr>
                    <td><label for="prod_name">Product Name:</label></td>
                    <td><input type="text" id="prod_name" name="prod_name" required></td>
                </tr>
                </tr>
                <tr>
                    <td><label for="price">Price:</label></td>
                    <td><input type="number" id="price" name="price" required></td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align:center; padding-top: 10px;"> <hr> <br>
                        <button type="submit">Update Catalog</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>    

</body>
</html>
